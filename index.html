<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>四能量測驗</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600&family=Noto+Sans+TC:wght@400;500&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --ink: #1E1E1E;
    --ink-light: #555;
    --line: #E0DDD8;
    --bg: #F9F7F4;
    --card: #FFFFFF;
    --gold: #C8972A;
    --gold-light: #F5E6C0;
    --dynamo: #3A6B8A;
    --blaze: #C05A2A;
    --tempo: #5A8A3A;
    --steel: #6A3A8A;
    --radius: 10px;
  }

  html { scroll-behavior: smooth; }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'Noto Sans TC', sans-serif;
    font-size: 15px;
    line-height: 1.7;
    min-height: 100vh;
  }

  /* Header */
  .header {
    text-align: center;
    padding: 56px 24px 40px;
    border-bottom: 1px solid var(--line);
  }
  .header-eyebrow {
    font-size: 11px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 16px;
    font-weight: 500;
  }
  .header h1 {
    font-family: 'Noto Serif TC', serif;
    font-size: clamp(28px, 5vw, 40px);
    font-weight: 600;
    color: var(--ink);
    margin-bottom: 14px;
    letter-spacing: 0.04em;
  }
  .header p {
    color: var(--ink-light);
    font-size: 14px;
    max-width: 480px;
    margin: 0 auto;
  }

  /* Progress */
  .progress-wrap {
    max-width: 640px;
    margin: 0 auto;
    padding: 24px 24px 0;
  }
  .progress-label {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: var(--ink-light);
    margin-bottom: 8px;
  }
  .progress-bar-bg {
    height: 3px;
    background: var(--line);
    border-radius: 2px;
    overflow: hidden;
  }
  .progress-bar-fill {
    height: 100%;
    background: var(--gold);
    border-radius: 2px;
    transition: width 0.4s ease;
    width: 0%;
  }

  /* Questions */
  .questions {
    max-width: 640px;
    margin: 0 auto;
    padding: 32px 24px 40px;
    display: flex;
    flex-direction: column;
    gap: 36px;
  }

  .q-block {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 28px 28px 24px;
    transition: border-color 0.2s;
  }
  .q-block.answered {
    border-color: var(--gold);
  }

  .q-number {
    font-size: 11px;
    letter-spacing: 0.15em;
    color: var(--gold);
    font-weight: 500;
    margin-bottom: 10px;
  }
  .q-text {
    font-family: 'Noto Serif TC', serif;
    font-size: 16px;
    font-weight: 600;
    color: var(--ink);
    margin-bottom: 20px;
    line-height: 1.6;
  }

  .options {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .option {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 12px 14px;
    border: 1.5px solid var(--line);
    border-radius: 7px;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
    text-align: left;
    background: var(--bg);
    width: 100%;
    font-family: 'Noto Sans TC', sans-serif;
    font-size: 14px;
    color: var(--ink);
    line-height: 1.6;
  }
  .option:hover {
    border-color: var(--gold);
    background: var(--gold-light);
  }
  .option.selected {
    border-color: var(--gold);
    background: var(--gold-light);
  }

  .option-label {
    flex-shrink: 0;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: var(--line);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 500;
    color: var(--ink-light);
    transition: background 0.15s, color 0.15s;
    margin-top: 1px;
  }
  .option.selected .option-label {
    background: var(--gold);
    color: #fff;
  }

  /* Submit */
  .submit-wrap {
    max-width: 640px;
    margin: 0 auto;
    padding: 0 24px 80px;
  }
  .submit-note {
    font-size: 13px;
    color: var(--ink-light);
    text-align: center;
    margin-bottom: 16px;
  }
  .submit-btn {
    display: block;
    width: 100%;
    padding: 16px;
    background: var(--ink);
    color: #fff;
    border: none;
    border-radius: var(--radius);
    font-family: 'Noto Sans TC', sans-serif;
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
    letter-spacing: 0.05em;
    transition: background 0.2s;
  }
  .submit-btn:hover:not(:disabled) { background: #333; }
  .submit-btn:disabled { opacity: 0.35; cursor: not-allowed; }

  /* Result */
  #result {
    display: none;
    max-width: 640px;
    margin: 0 auto;
    padding: 0 24px 80px;
  }

  .result-card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    overflow: hidden;
  }

  .result-header {
    background: var(--ink);
    color: #fff;
    padding: 28px;
    text-align: center;
  }
  .result-header p {
    font-size: 12px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.5);
    margin-bottom: 8px;
  }
  .result-header h2 {
    font-family: 'Noto Serif TC', serif;
    font-size: 22px;
    font-weight: 600;
    letter-spacing: 0.04em;
  }

  .result-rows {
    padding: 24px 28px;
    display: flex;
    flex-direction: column;
    gap: 0;
  }

  .result-row {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 16px 0;
    border-bottom: 1px solid var(--line);
  }
  .result-row:last-child { border-bottom: none; }

  .result-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .result-name {
    font-family: 'Noto Serif TC', serif;
    font-size: 15px;
    font-weight: 600;
    flex: 1;
  }
  .result-name span {
    display: block;
    font-family: 'Noto Sans TC', sans-serif;
    font-size: 11px;
    font-weight: 400;
    color: var(--ink-light);
    margin-top: 1px;
  }

  .result-pct {
    font-family: 'Noto Serif TC', serif;
    font-size: 26px;
    font-weight: 600;
    letter-spacing: -0.02em;
    min-width: 64px;
    text-align: right;
  }

  .result-bar-wrap {
    flex: 2;
    height: 6px;
    background: var(--line);
    border-radius: 3px;
    overflow: hidden;
  }
  .result-bar {
    height: 100%;
    border-radius: 3px;
    transition: width 0.8s cubic-bezier(0.4,0,0.2,1);
    width: 0%;
  }

  /* Copy */
  .copy-wrap {
    padding: 0 28px 28px;
  }
  .copy-box {
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 7px;
    padding: 16px;
    font-size: 13px;
    color: var(--ink-light);
    line-height: 1.8;
    white-space: pre-wrap;
    word-break: break-word;
    font-family: 'Noto Sans TC', sans-serif;
    margin-bottom: 12px;
    user-select: all;
  }
  .copy-btn {
    display: block;
    width: 100%;
    padding: 13px;
    background: var(--gold);
    color: #fff;
    border: none;
    border-radius: 7px;
    font-family: 'Noto Sans TC', sans-serif;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    letter-spacing: 0.05em;
    transition: background 0.2s;
  }
  .copy-btn:hover { background: #b07f20; }
  .copy-btn.copied { background: var(--tempo); }

  .retry-btn {
    display: block;
    width: 100%;
    padding: 13px;
    background: transparent;
    color: var(--ink-light);
    border: 1px solid var(--line);
    border-radius: 7px;
    font-family: 'Noto Sans TC', sans-serif;
    font-size: 13px;
    cursor: pointer;
    margin-top: 10px;
    transition: border-color 0.2s, color 0.2s;
  }
  .retry-btn:hover { border-color: var(--ink); color: var(--ink); }

  @media (max-width: 480px) {
    .q-block { padding: 20px 16px; }
    .result-rows { padding: 16px 20px; }
    .copy-wrap { padding: 0 20px 20px; }
    .result-row { gap: 10px; }
    .result-bar-wrap { display: none; }
  }
</style>
</head>

<div class="header">

  <h1>四能量測驗</h1>

<div class="questions" id="questions-container"></div>

<div class="submit-wrap">
  <p class="submit-note" id="submit-note">還有 <strong id="remaining">25</strong> 題未作答</p>

</div>

<div id="result">

    <div class="copy-wrap">

      <button class="copy-btn" id="copy-btn">複製結果</button>
      <button class="retry-btn" id="retry-btn">重新測驗</button>
    </div>
  </div>
</div>

    ]
  },
  // 壓力下的真實反應
  {
    text: "當你的努力沒有得到上級的肯定時，你會怎麼做？",
    options: [
      { label: "A", text: "急於展現自己更多的新點子來引起注意", energy: "D" },
      { label: "B", text: "花更多時間試圖討好對方，建立更好的關係", energy: "B" },
      { label: "C", text: "覺得上級對你不公平，選擇默默等待機會", energy: "T" },
      { label: "D", text: "開始懷疑整個系統，並計劃如何改善流程以防止再發生", energy: "S" }
    ]
  },
  {
    text: "當你的朋友忽視了你的感受時，你會有什麼反應？",
    options: [
      { label: "A", text: "嘗試用極端的方式吸引對方的注意力", energy: "D" },
      { label: "B", text: "過於敏感，可能直接與對方爭吵", energy: "B" },
      { label: "C", text: "假裝沒事，但內心感到受傷和委屈", energy: "T" },
      { label: "D", text: "完全冷漠，切斷與對方的聯繫，專注自己的事情", energy: "S" }
    ]
  },
  {
    text: "當團隊中有人質疑你的能力時，你會怎麼反應？",
    options: [
      { label: "A", text: "不斷提出新方案，想要證明自己的價值", energy: "D" },
      { label: "B", text: "過於強調自己與其他人的關係，希望獲得支持", energy: "B" },
      { label: "C", text: "開始覺得壓力過大，減少對工作的投入", energy: "T" },
      { label: "D", text: "將注意力放在批評者身上，試圖分析他們的弱點", energy: "S" }
    ]
  },
  {
    text: "當你需要面對一個你不擅長的任務時，你會有什麼表現？",
    options: [
      { label: "A", text: "強迫自己想出創新的方法來掩蓋不足", energy: "D" },
      { label: "B", text: "將重心轉移到與人互動上，而忽略實際工作需求", energy: "B" },

    options: [

      { label: "D", text: "認為問題源於系統錯誤，試圖重建一個新系統", energy: "S" }
    ]
  }
];

const ENERGY_CONFIG = {
  D: { name: "發電機", label: "創新・行動・直覺", color: "#3A6B8A" },
  B: { name: "火焰",  label: "人際・連結・情感", color: "#C05A2A" },
  T: { name: "節奏",  label: "穩定・節奏・耐心", color: "#5A8A3A" },
  S: { name: "鋼鐵",  label: "分析・細節・系統", color: "#6A3A8A" }
};

const answers = new Array(questions.length).fill(null);

function updateProgress() {
  const answered = answers.filter(a => a !== null).length;
  const pct = Math.round((answered / questions.length) * 100);
  document.getElementById('progress-text').textContent = `${answered} / ${questions.length} 題`;
  document.getElementById('progress-pct').textContent = `${pct}%`;
  document.getElementById('progress-fill').style.width = pct + '%';

  const remaining = questions.length - answered;
  document.getElementById('remaining').textContent = remaining;
  const note = document.getElementById('submit-note');
  if (remaining === 0) {
    note.innerHTML = '所有題目已完成，可以查看結果';
  } else {
    note.innerHTML = `還有 <strong>${remaining}</strong> 題未作答`;
  }
  document.getElementById('submit-btn').disabled = answered < questions.length;
}

function render() {
  const container = document.getElementById('questions-container');
  container.innerHTML = '';

  questions.forEach((q, qi) => {
    const block = document.createElement('div');
    block.className = 'q-block' + (answers[qi] !== null ? ' answered' : '');
    block.id = `q-${qi}`;

    const num = document.createElement('div');
    num.className = 'q-number';
    num.textContent = `Q${String(qi + 1).padStart(2, '0')}`;
    block.appendChild(num);

    const text = document.createElement('div');
    text.className = 'q-text';
    text.textContent = q.text;
    block.appendChild(text);

    const opts = document.createElement('div');
    opts.className = 'options';

    q.options.forEach((opt, oi) => {
      const btn = document.createElement('button');
      btn.className = 'option' + (answers[qi] === oi ? ' selected' : '');
      btn.innerHTML = `<span class="option-label">${opt.label}</span><span>${opt.text}</span>`;
      btn.addEventListener('click', ((qIndex, oIndex, button) => () => {
        answers[qIndex] = oIndex;
        document.querySelectorAll(`#q-${qIndex} .option`).forEach(b => b.classList.remove('selected'));
        button.classList.add('selected');
        document.getElementById(`q-${qIndex}`).classList.add('answered');
        updateProgress();
      })(qi, oi, btn));
      opts.appendChild(btn);
    });

    block.appendChild(opts);
    container.appendChild(block);
  });

  updateProgress();
}

function showResult() {
  const scores = { D: 0, B: 0, T: 0, S: 0 };
  answers.forEach((ai, qi) => {
    if (ai !== null) scores[questions[qi].options[ai].energy]++;
  });

  const total = questions.length;
  const rows = document.getElementById('result-rows');
  rows.innerHTML = '';

  const order = ['D','B','T','S'];
  const resultLines = ['【四能量測驗結果】\n發電機（創新・行動・直覺）/ 火焰（人際・連結・情感）/ 節奏（穩定・節奏・耐心）/ 鋼鐵（分析・細節・系統）\n'];

  order.forEach(key => {
    const cfg = ENERGY_CONFIG[key];
    const pct = Math.round((scores[key] / total) * 100);
    resultLines.push(`${cfg.name}（${cfg.label}）：${pct}%`);

    const row = document.createElement('div');
    row.className = 'result-row';
    row.innerHTML = `
      <div class="result-dot" style="background:${cfg.color}"></div>
      <div class="result-name">${cfg.name}<span>${cfg.label}</span></div>
      <div class="result-bar-wrap"><div class="result-bar" style="background:${cfg.color}" data-pct="${pct}"></div></div>
      <div class="result-pct" style="color:${cfg.color}">${pct}%</div>
    `;
    rows.appendChild(row);
  });

  const copyText = resultLines.join('\n');
  document.getElementById('copy-text').textContent = copyText;

  // hide questions, show result
  document.getElementById('questions-container').style.display = 'none';
  document.querySelector('.submit-wrap').style.display = 'none';
  document.querySelector('.progress-wrap').style.display = 'none';
  document.getElementById('result').style.display = 'block';
  window.scrollTo({ top: 0, behavior: 'smooth' });

  // animate bars
  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      document.querySelectorAll('.result-bar').forEach(bar => {
        bar.style.width = bar.dataset.pct + '%';
      });
    });
  });

  // copy button
  document.getElementById('copy-btn').addEventListener('click', () => {
    navigator.clipboard.writeText(copyText).then(() => {
      const btn = document.getElementById('copy-btn');
      btn.textContent = '已複製！';
      btn.classList.add('copied');
      setTimeout(() => {
        btn.textContent = '複製結果';
        btn.classList.remove('copied');
      }, 2000);
    });
  });

  // retry
  document.getElementById('retry-btn').addEventListener('click', () => {
    answers.fill(null);
    document.getElementById('questions-container').style.display = '';
    document.querySelector('.submit-wrap').style.display = '';
    document.querySelector('.progress-wrap').style.display = '';
    document.getElementById('result').style.display = 'none';
    render();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });
}

document.getElementById('submit-btn').addEventListener('click', showResult);

render();
</script>
